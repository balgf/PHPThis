worker_processes 1;
pid /tmp/peer-nginx.pid;
error_log /tmp/peer-nginx.log warn;
events { worker_connections 32; }
http {
    access_log off;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server {
        listen 127.0.0.1:8080;
        listen [::1]:8080;
        location / {
            include /tmp/peer-config/fastcgi.conf;
            fastcgi_param REMOTE_ADDR $remote_addr;
        }
    }
    server {
        listen 127.0.0.1:8081;
        set_real_ip_from 127.0.0.1;
        real_ip_header X-Forwarded-For;
        location / {
            include /tmp/peer-config/fastcgi.conf;
            fastcgi_param REMOTE_ADDR $remote_addr;
        }
    }
    server {
        listen 127.0.0.1:8082;
        set_real_ip_from 127.0.0.1;
        real_ip_header X-Forwarded-For;
        location / {
            include /tmp/peer-config/fastcgi.conf;
            fastcgi_param REMOTE_ADDR $realip_remote_addr;
        }
    }
    server {
        listen 127.0.0.1:8083;
        location / { include /tmp/peer-config/fastcgi.conf; }
    }
    server {
        listen 127.0.0.1:8084;
        location / {
            include /tmp/peer-config/fastcgi.conf;
            fastcgi_param REMOTE_ADDR private-sentinel;
        }
    }
    server {
        listen 127.0.0.1:8085;
        location / {
            include /tmp/peer-config/fastcgi.conf;
            fastcgi_param REMOTE_ADDR "";
        }
    }
}
