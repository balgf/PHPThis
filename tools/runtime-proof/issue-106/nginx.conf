load_module /usr/lib/nginx/modules/ngx_http_js_module.so;
worker_processes 1;
pid /tmp/machine-nginx.pid;
error_log /tmp/machine-nginx.log crit;
events { worker_connections 32; }
http {
    access_log off;
    js_import machine from /tmp/machine-config/headers.js;
    js_set $machine_headers_accepted machine.accepted;
    underscores_in_headers on;
    ignore_invalid_headers off;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 1k;
    server {
        listen 127.0.0.1:8080;
        server_tokens off;
        default_type application/json;
        add_header Cache-Control "private, no-store" always;
        error_page 400 413 414 431 494 =400 /_invalid;
        location = /_invalid {
            internal;
            return 400 '{"error":{"code":"invalid_request","message":"Request is invalid."}}\n';
        }
        location / {
            if ($machine_headers_accepted != yes) {
                return 403 '{"error":{"code":"forbidden","message":"Request is forbidden."}}\n';
            }
            include /tmp/machine-config/fastcgi.conf;
            fastcgi_hide_header Cache-Control;
        }
    }
}
