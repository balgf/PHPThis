name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: PHP ${{ matrix.php }} validity
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']

    services:
      redis-cache:
        image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
      redis-lease:
        image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports:
          - 6380:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_sqlite, redis
          coverage: pcov
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install locked dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run validity gate
        run: composer check

      - name: Generate report-only coverage
        run: composer test:coverage

      - name: Upload maintainer test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: php-${{ matrix.php }}-maintainer-test-reports
          path: |
            .phpunit.cache/junit.xml
            .phpunit.cache/coverage.xml
          if-no-files-found: warn

  database-transport:
    name: PDO transport (SQLite 3.45.1, MySQL 8.4.11, PostgreSQL 17.11)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    services:
      mysql:
        image: mysql:8.4@sha256:0744ee5ef89ce6ccfa13de3e579fe6b9e27f93dd70da9c06d2c908b1b193fb8d
        env:
          MYSQL_DATABASE: phpthis
          MYSQL_USER: phpthis
          MYSQL_PASSWORD: phpthis
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:17@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
        env:
          POSTGRES_DB: phpthis
          POSTGRES_USER: phpthis
          POSTGRES_PASSWORD: phpthis
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U phpthis -d phpthis"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP database drivers
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_sqlite, pdo_mysql, pdo_pgsql, redis
          coverage: none
          tools: composer:v2

      - name: Install locked dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Certify PDO base transport
        run: composer test:database-drivers
        env:
          PHPTHIS_DATABASE_TEST_DRIVERS: sqlite,mysql,pgsql
          PHPTHIS_SQLITE_EXPECTED_VERSION: '3.45.1'
          PHPTHIS_MYSQL_EXPECTED_VERSION: '8.4.11'
          PHPTHIS_PGSQL_EXPECTED_VERSION: '17.11'
          PHPTHIS_MYSQL_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=phpthis;charset=utf8mb4'
          PHPTHIS_MYSQL_USERNAME: phpthis
          PHPTHIS_MYSQL_PASSWORD: phpthis
          PHPTHIS_PGSQL_DSN: 'pgsql:host=127.0.0.1;port=5432;dbname=phpthis'
          PHPTHIS_PGSQL_USERNAME: phpthis
          PHPTHIS_PGSQL_PASSWORD: phpthis
