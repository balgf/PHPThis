name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: PHP ${{ matrix.php }} validity
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']

    services:
      redis-cache:
        image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
      redis-lease:
        image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports:
          - 6380:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_sqlite, redis, curl, simplexml, posix
          coverage: pcov
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install locked dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install locked optional S3 reference dependencies
        run: composer install --working-dir=tools/generated-s3 --no-interaction --no-progress --prefer-dist

      - name: Run validity gate
        run: composer check

      - name: Generate report-only coverage
        run: composer test:coverage

      - name: Upload maintainer test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: php-${{ matrix.php }}-maintainer-test-reports
          path: |
            .phpunit.cache/junit.xml
            .phpunit.cache/coverage.xml
          if-no-files-found: warn

  database-transport:
    name: PDO transport (SQLite 3.45.1, MySQL 8.4.11, PostgreSQL 17.11)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    services:
      mysql:
        image: mysql:8.4@sha256:0744ee5ef89ce6ccfa13de3e579fe6b9e27f93dd70da9c06d2c908b1b193fb8d
        env:
          MYSQL_DATABASE: phpthis
          MYSQL_USER: phpthis
          MYSQL_PASSWORD: phpthis
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:17@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
        env:
          POSTGRES_DB: phpthis
          POSTGRES_USER: phpthis
          POSTGRES_PASSWORD: phpthis
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U phpthis -d phpthis"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP database drivers
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: pdo, pdo_sqlite, pdo_mysql, pdo_pgsql, redis
          coverage: none
          tools: composer:v2

      - name: Install locked dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Verify PDO transport and bulk-write recipes
        run: composer test:database-drivers
        env:
          PHPTHIS_DATABASE_TEST_DRIVERS: sqlite,mysql,pgsql
          PHPTHIS_SQLITE_EXPECTED_VERSION: '3.45.1'
          PHPTHIS_MYSQL_EXPECTED_VERSION: '8.4.11'
          PHPTHIS_PGSQL_EXPECTED_VERSION: '17.11'
          PHPTHIS_MYSQL_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=phpthis;charset=utf8mb4'
          PHPTHIS_MYSQL_USERNAME: phpthis
          PHPTHIS_MYSQL_PASSWORD: phpthis
          PHPTHIS_PGSQL_DSN: 'pgsql:host=127.0.0.1;port=5432;dbname=phpthis'
          PHPTHIS_PGSQL_USERNAME: phpthis
          PHPTHIS_PGSQL_PASSWORD: phpthis

  mysql-durable-work:
    name: MySQL 8.4.11 durable welcome work
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the checked PHP client
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: pdo, pdo_sqlite, pdo_mysql, redis
          coverage: none
          tools: composer:v2
      - name: Install locked dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Pull the reviewed MySQL image
        run: docker pull mysql:8.4@sha256:0744ee5ef89ce6ccfa13de3e579fe6b9e27f93dd70da9c06d2c908b1b193fb8d
      - name: Verify isolated MySQL publication, delivery and recovery
        run: python3 tools/mysql-jobs/run.py
      - name: Upload redacted MySQL evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mysql-durable-work-evidence
          path: tmp/mysql-jobs-evidence.json
          if-no-files-found: error

  inspected-png:
    name: Inspected PNG and JPEG quarantine and resource bounds
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the application PHP runtime
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: pdo, pdo_sqlite, posix, redis
          coverage: none
          tools: composer:v2
      - name: Install locked dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Build the pinned PNG and JPEG inspector
        run: docker build -t phpthis-inspected-media:issue108 tools/inspected-media
      - name: Build deliberate resource-failure and update controls
        run: |
          docker build --build-arg INSPECTOR_IMAGE=phpthis-inspected-media:issue108 -f tools/inspected-media/tests/fault.Dockerfile -t phpthis-inspected-media:issue108-faults tools/inspected-media
          docker build --build-arg INSPECTOR_IMAGE=phpthis-inspected-media:issue108 -f tools/inspected-media/tests/update.Dockerfile -t phpthis-inspected-media:issue108-update tools/inspected-media
          docker build --build-arg INSPECTOR_IMAGE=phpthis-inspected-media:issue108 --label phpthis.fixture-recovery=third -f tools/inspected-media/tests/update.Dockerfile -t phpthis-inspected-media:issue108-recovery tools/inspected-media
      - name: Verify parser, upload lifecycle and real resource failures
        run: python3 tools/inspected-media/run.py
      - name: Upload redacted inspection evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inspected-png-evidence
          path: tmp/inspected-media-evidence.json
          if-no-files-found: error
